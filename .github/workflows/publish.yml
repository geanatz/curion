name: publish

# Manual release gate. Only an explicit workflow_dispatch on main can publish.
# The workflow retains npm OIDC Trusted Publishing and provenance.
# Version and confirmation inputs must match the checked-out package.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package.json version to publish (e.g. 0.3.7)"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH to authorize this npm release"
        required: true
        type: string

# Least-privilege default at the workflow level. The publish job below
# adds `id-token: write` (required for npm Trusted Publishing / OIDC).
permissions:
  contents: read

jobs:
  publish:
    name: publish to npm with provenance
    # Reject dispatches against any branch other than main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # `id-token: write` is required for the OIDC exchange that produces
    # the short-lived npm publish credential. `contents: read` is
    # already inherited from the workflow-level defaults; restated here
    # so the job's full permission set is auditable in one place.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24 with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          # `cache:` is intentionally NOT set. Trusted publishing reads
          # the exact lockfile-resolved tree via `npm ci`, so we do not
          # want a warm cache that could mask a stale lockfile or a
          # compromised cache entry. `cache: ""` is set explicitly so a
          # future default-on behaviour from `actions/setup-node` can
          # not silently re-enable caching for this job.
          cache: ""

      - name: Install latest npm and print diagnostic version
        # npm Trusted Publishing via OIDC requires npm >= 11.5.1 on the
        # runner. Node 22 LTS ships with npm 10.x and Node 20 LTS ships
        # with npm 9.x, both of which pre-date the OIDC publish
        # credential exchange. We pin Node 24 above and explicitly
        # install the latest npm from the public registry here so the
        # publish step runs against a known-good CLI. The
        # `npm --version` line is a diagnostic that prints the exact
        # CLI version that will run the publish, so any future
        # regression is visible in the run log.
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@latest
          echo "npm version: $(npm --version)"
          echo "node version: $(node --version)"

      - name: Verify explicit approval and package version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_CONFIRMATION}" != "PUBLISH" ]]; then
            echo "::error::Explicit PUBLISH confirmation is required."
            exit 1
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only stable semver releases are allowed."
            exit 1
          fi
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ "${RELEASE_VERSION}" != "${pkg_version}" ]]; then
            echo "::error::Requested version does not match package.json."
            exit 1
          fi
          echo "Confirmed manual npm release ${pkg_version} from main."

      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Build TypeScript
        run: npm run build

      - name: Publish to npm with provenance
        # `publishConfig.provenance: true` and `publishConfig.access:
        # "public"` in package.json already enable provenance and
        # public access for the scoped `@geanatz/curion` package.
        # `--provenance` is passed explicitly for clarity; it is a
        # no-op given the publishConfig flag and is safe to keep.
        # `--access public` is also redundant with publishConfig but
        # is passed explicitly so that a future publishConfig regression
        # (for example access reverting to the scoped default of
        # "restricted") cannot silently produce a private publish.
        #
        # No `NODE_AUTH_TOKEN` env is set on purpose: authentication
        # is handled by the GitHub OIDC -> npm Trusted Publisher
        # exchange, which `actions/setup-node` + `id-token: write`
        # + `npm >= 11.5.1` perform automatically. We re-print
        # `npm --version` here for redundancy with the earlier
        # diagnostic and to make the publish-time CLI version
        # auditable in the run log on its own.
        shell: bash
        run: |
          set -euo pipefail
          echo "publish-time npm version: $(npm --version)"
          echo "publish-time node version: $(node --version)"
          npm publish --provenance --access public