name: CI

on:
  workflow_dispatch:
  # TEMPORARY: PR #7 synthetic NTFS diagnosis only; revert after evidence capture.
  pull_request:
    branches: [main]
    types: [synchronize]

# Least-privilege: the workflow only needs to read the repository contents.
# No write permissions, no token scopes beyond what is strictly necessary.
permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}

    strategy:
      # Let macOS report even when another platform fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Smoke-test packaged npm artifact
        run: npm run test:package


  ntfs-diagnostic:
    # Single disposable Windows runner, only PR #7; no main/release changes.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 7
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build candidate
        run: npm run build
      - name: Inspect synthetic NTFS ACL inheritance
        shell: pwsh
        run: ./.github/scripts/ntfs-acl-probe.ps1
