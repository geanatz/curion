name: CI

on:
  workflow_dispatch:
  # TEMPORARY exception for PR #7 review, remove after capturing checks.
  pull_request:
    branches: [main]
    types: [synchronize]

# Least-privilege: the workflow only needs to read the repository contents.
# No write permissions, no token scopes beyond what is strictly necessary.
permissions:
  contents: read

jobs:
  build-and-test:
    # Only draft PR #7 may use the temporary automatic trigger.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 7
    runs-on: ${{ matrix.os }}

    strategy:
      # Let macOS report even when another platform fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Smoke-test packaged npm artifact
        run: npm run test:package
