name: CI

on:
  # Stable-release policy: CI is dispatched explicitly by the owner.
  workflow_dispatch:

# Least-privilege: the workflow only needs to read the repository contents.
# No write permissions, no token scopes beyond what is strictly necessary.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
